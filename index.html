<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Mijn Pokémon Collectie</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:10;background:#111827;color:#fff;padding:14px}h1{font-size:20px;margin:0 0 10px}.tools,.tabs{display:flex;gap:8px}.tabs{overflow:auto;padding-top:10px}.tab{white-space:nowrap;border:0;border-radius:99px;padding:9px 12px;background:#374151;color:#fff;font-weight:700}.tab.on{background:#facc15;color:#111827}input,select{border:0;border-radius:10px;padding:10px;font-size:16px}input{min-width:0;flex:1}main{padding:14px;max-width:1100px;margin:auto}.sum{font-weight:800;margin-bottom:12px}.grid{display:flex;flex-direction:column;gap:7px}.card{background:#fff;border:2px solid transparent;border-radius:12px;padding:0;box-shadow:0 1px 5px #0001;overflow:hidden}.card.y{border-color:#22c55e;background:#f0fdf4}.row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:7px;padding:8px 9px;cursor:pointer;font-size:13px}.num{font-weight:900;font-size:12px}.name{min-width:0;font-weight:700;line-height:1.2}.kind{display:block;margin-top:2px;font-size:10px;font-weight:600;color:#6b7280}.status{border-radius:99px;padding:4px 6px;font-size:9px;font-weight:900;background:#e5e7eb}.y .status{background:#16a34a;color:#fff}.details{display:none;padding:0 12px 12px;text-align:center}.card.open .details{display:block}.pic{width:min(100%,320px);aspect-ratio:2.5/3.5;object-fit:contain;background:#e5e7eb;border-radius:10px}.toggle{display:block;width:min(100%,320px);margin:8px auto 0;border:0;border-radius:10px;padding:11px;font-weight:900;background:#111827;color:#fff}.y .toggle{background:#16a34a}.variants{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;width:min(100%,320px);margin:9px auto 0}.vbtn{border:1px solid #d1d5db;background:#fff;border-radius:9px;padding:8px 5px;font-size:11px;font-weight:800;color:#374151}.vbtn.on{background:#16a34a;border-color:#16a34a;color:#fff}.savebtn{display:block;width:min(100%,320px);margin:8px auto 0;border:0;border-radius:10px;padding:11px;font-size:13px;font-weight:900;background:#2563eb;color:#fff}.savebtn:disabled{background:#9ca3af}.ownedline{display:flex;flex-wrap:wrap;gap:3px 7px;margin-top:3px;font-size:10px;font-weight:800}.ovyes{color:#15803d}.ovno{color:#dc2626}@media(min-width:700px){main{max-width:760px}}</style></head><body><header><h1>⚡ Mijn Pokémon Collectie</h1><div class="tools"><input id="q" placeholder="Zoek nummer…"><select id="f"><option value="all">Alles</option><option value="yes">In bezit</option><option value="no">Ontbreekt</option></select></div><div class="tabs" id="tabs"></div></header><main><div class="sum" id="sum"></div><div class="grid" id="grid"></div></main><script>
const S=[
["Perfect Order","me3","me03",124,[1,2,3,5,6,8,9,10,11,13,14,15,17,18,19,20,22,23,26,27,28,29,32,33,34,35,36,37,41,42,43,45,46,48,49,52,54,56,57,58,59,61,63,64,65,66,67,68,70,72,73,75,76,77,78,79,81,82,84,86,87,90,95]],

["Chaos Rising","me4","me04",122,[2,6,9,10,11,13,17,21,24,34,37,43,47,53,59,61,66,70,71,74,81,85,86,96,113]],

["Battle Styles","swsh5","swsh5",183,[125]],
["Shining Fates","swsh45","swsh45",72,[59]],

let meta={},cur=0,seed={},store=JSON.parse(localStorage.getItem("poke-all-v2")||"{}");const V=["Normal","Holo","Reverse","IR","UR","SIR","MHR/HR","1st Edition","W Promo"];
function key(s,n){return s[0]+"#"+n}
function vkey(s,n,v){return key(s,n)+"#"+v}
function legacy(s,n){let k=key(s,n);return k in store?store[k]:s[4].includes(n)}
function vhas(s,n,v){let k=vkey(s,n,v);if(k in store)return !!store[k];let a=seed[key(s,n)];if(a)return a.includes(v);return false}
function ownedVariants(s,n){return V.filter(v=>vhas(s,n,v))}
function has(s,n){return ownedVariants(s,n).length>0}
function setVariant(s,n,v,val){store[vkey(s,n,v)]=val;localStorage.setItem("poke-all-v2",JSON.stringify(store))}function nums(s){return s[3]?[...Array(s[3])].map((_,i)=>i+1):s[4]}function img(s,n){return "https://images.scrydex.com/pokemon/"+s[1]+"-"+n+"/medium"}
function mkey(s,n){return s[2]+"-"+String(n).padStart(3,"0")}
function cardName(s,n){return meta[mkey(s,n)]?.name||("Kaart "+String(n).padStart(3,"0"))}
function cardKind(s,n){let m=meta[mkey(s,n)];return m?.rarity||"Kaartvariant"}
function specialVariant(m){let r=(m?.rarity||"").toLowerCase();if(r.includes("special illustration"))return "SIR";if(r.includes("illustration rare"))return "IR";if(r.includes("mega hyper")||r.includes("hyper rare"))return "MHR/HR";if(r.includes("ultra rare")||r.includes("full art"))return "UR";return ""}
function availableVariants(s,n){let m=meta[mkey(s,n)],sp=specialVariant(m);if(sp)return [sp];let x=m?.variants;if(x&&typeof x==="object"&&!Array.isArray(x)){let a=[];if(x.normal===true)a.push("Normal");if(x.holo===true)a.push("Holo");if(x.reverse===true)a.push("Reverse");if(x.firstEdition===true)a.push("1st Edition");if(x.wPromo===true)a.push("W Promo");if(a.length)return a}let r=(m?.rarity||"").toLowerCase();if(r.includes("ace spec"))return ["Holo","Reverse"];if(r.includes("holo"))return ["Holo","Reverse"];return ["Normal","Reverse"]}
async function loadMeta(s){if(s._loaded)return;s._loaded=true;try{let r=await fetch("https://api.tcgdex.net/v2/en/sets/"+s[2]);if(!r.ok)return;let d=await r.json();(d.cards||[]).forEach(x=>{meta[x.id]={name:x.name,rarity:x.rarity||"",variants:x.variants||null}});render()}catch(e){}}
async function loadCardDetail(s,n){let k=mkey(s,n),m=meta[k];if(m?._detail)return;if(!m)meta[k]={name:"Kaart "+String(n).padStart(3,"0"),rarity:"",variants:null};try{let r=await fetch("https://api.tcgdex.net/v2/en/cards/"+k);if(!r.ok)return;let d=await r.json();meta[k]={...meta[k],name:d.name||meta[k].name,rarity:d.rarity||meta[k].rarity,variants:d.variants||meta[k].variants,_detail:true};render()}catch(e){}}
function tabs(){let e=document.getElementById("tabs");e.innerHTML="";S.forEach((s,i)=>{let b=document.createElement("button");b.className="tab"+(i===cur?" on":"");b.textContent=s[0];b.onclick=()=>{cur=i;fetch("csv-seed.json?v=20261005-2").then(r=>r.json()).then(d=>{seed=d;tabs();render()}).catch(()=>{tabs();render()})};e.appendChild(b)})}function render(){let s=S[cur];loadMeta(s);let a=nums(s),q=document.getElementById("q").value.trim(),f=document.getElementById("f").value,own=a.filter(n=>has(s,n)).length;document.getElementById("sum").textContent=s[0]+" · "+own+" / "+a.length+" in bezit";a=a.filter(n=>(!q||String(n).includes(q))&&(f==="all"||(f==="yes"&&has(s,n))||(f==="no"&&!has(s,n))));let g=document.getElementById("grid");g.innerHTML="";a.forEach(n=>{let ov=ownedVariants(s,n),y=ov.length>0,av=availableVariants(s,n),e=document.createElement("article");e.className="card"+(y?" y":"");let ownedText=av.map(v=>'<span class="'+(vhas(s,n,v)?'ovyes':'ovno')+'">'+v+' '+(vhas(s,n,v)?'✓':'✕')+'</span>').join("");e.innerHTML='<div class="row"><span class="num">#'+String(n).padStart(3,"0")+'</span><span class="name">'+cardName(s,n)+'<span class="kind">'+cardKind(s,n)+'</span><span class="ownedline '+(ov.length?"":"none")+'">'+ownedText+'</span></span><span class="status">'+(y?"✓ "+ov.length:"OPEN")+'</span></div><div class="details"><img class="pic" loading="lazy" src="'+img(s,n)+'" alt="'+s[0]+' #'+n+'" onerror="this.style.opacity=.15"><div class="variants">'+av.map(v=>'<button class="vbtn '+(vhas(s,n,v)?"on":"")+'" data-v="'+v+'">'+v+(vhas(s,n,v)?" ✓":"")+'</button>').join("")+'</div><button class="savebtn">Opslaan</button></div>';let draft={};av.forEach(v=>draft[v]=vhas(s,n,v));e.querySelector(".row").onclick=()=>{e.classList.toggle("open");if(e.classList.contains("open"))loadCardDetail(s,n)};e.querySelectorAll(".vbtn").forEach(b=>b.onclick=(ev)=>{ev.stopPropagation();let v=b.dataset.v;draft[v]=!draft[v];b.classList.toggle("on",draft[v]);b.textContent=v+(draft[v]?" ✓":"")});e.querySelector(".savebtn").onclick=(ev)=>{ev.stopPropagation();av.forEach(v=>setVariant(s,n,v,draft[v]));render()};g.appendChild(e)})}document.getElementById("q").oninput=render;document.getElementById("f").onchange=render;tabs();render();
</script></body></html>
