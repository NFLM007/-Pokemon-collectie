<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Mijn Pokémon Collectie</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:10;background:#111827;color:#fff;padding:14px}h1{font-size:20px;margin:0 0 10px}.tools,.tabs{display:flex;gap:8px}.tabs{overflow:auto;padding-top:10px}.tab{white-space:nowrap;border:0;border-radius:99px;padding:9px 12px;background:#374151;color:#fff;font-weight:700}.tab.on{background:#facc15;color:#111827}input,select{border:0;border-radius:10px;padding:10px;font-size:16px}input{min-width:0;flex:1}main{padding:14px;max-width:1100px;margin:auto}.sum{font-weight:800;margin-bottom:12px}.grid{display:flex;flex-direction:column;gap:7px}.card{background:#fff;border:2px solid transparent;border-radius:12px;padding:0;box-shadow:0 1px 5px #0001;overflow:hidden}.card.y{border-color:#22c55e;background:#f0fdf4}.row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:7px;padding:8px 9px;cursor:pointer;font-size:13px}.num{font-weight:900;font-size:12px}.name{min-width:0;font-weight:700;line-height:1.2}.kind{display:block;margin-top:2px;font-size:10px;font-weight:600;color:#6b7280}.status{border-radius:99px;padding:4px 6px;font-size:9px;font-weight:900;background:#e5e7eb}.y .status{background:#16a34a;color:#fff}.details{display:none;padding:0 12px 12px;text-align:center}.card.open .details{display:block}.pic{width:min(100%,320px);aspect-ratio:2.5/3.5;object-fit:contain;background:#e5e7eb;border-radius:10px}.toggle{display:block;width:min(100%,320px);margin:8px auto 0;border:0;border-radius:10px;padding:11px;font-weight:900;background:#111827;color:#fff}.y .toggle{background:#16a34a}.variants{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;width:min(100%,320px);margin:9px auto 0}.vbtn{border:1px solid #d1d5db;background:#fff;border-radius:9px;padding:8px 5px;font-size:11px;font-weight:800;color:#374151}.vbtn.on{background:#16a34a;border-color:#16a34a;color:#fff}.ownedline{display:block;margin-top:2px;font-size:10px;font-weight:700;color:#15803d}.ownedline.none{color:#9ca3af}@media(min-width:700px){main{max-width:760px}}</style></head><body><header><h1>⚡ Mijn Pokémon Collectie</h1><div class="tools"><input id="q" placeholder="Zoek nummer…"><select id="f"><option value="all">Alles</option><option value="yes">In bezit</option><option value="no">Ontbreekt</option></select></div><div class="tabs" id="tabs"></div></header><main><div class="sum" id="sum"></div><div class="grid" id="grid"></div></main><script>
const S=[

let meta={},cur=0,store=JSON.parse(localStorage.getItem("poke-all-v1")||"{}");const V=["Normal","Holo","Reverse","IR","UR","SIR","MHR/HR"];
function key(s,n){return s[0]+"#"+n}
function vkey(s,n,v){return key(s,n)+"#"+v}
function legacy(s,n){let k=key(s,n);return k in store?store[k]:s[3].includes(n)}
function vhas(s,n,v){let k=vkey(s,n,v);if(k in store)return !!store[k];return v==="Normal"&&legacy(s,n)}
function ownedVariants(s,n){return V.filter(v=>vhas(s,n,v))}
function has(s,n){return ownedVariants(s,n).length>0}
function setVariant(s,n,v,val){store[vkey(s,n,v)]=val;localStorage.setItem("poke-all-v1",JSON.stringify(store))}function nums(s){return s[2]?[...Array(s[2])].map((_,i)=>i+1):s[3]}function img(s,n){return "https://images.scrydex.com/pokemon/"+s[1]+"-"+n+"/medium"}
function mkey(s,n){return s[1]+"-"+n}
function cardName(s,n){return meta[mkey(s,n)]?.name||("Kaart "+String(n).padStart(3,"0"))}
function cardKind(s,n){let m=meta[mkey(s,n)];return m?.rarity||"Kaartvariant"}
async function loadMeta(s){if(s._loaded)return;s._loaded=true;try{let r=await fetch("https://api.tcgdex.net/v2/en/sets/"+s[1]);if(!r.ok)return;let d=await r.json();(d.cards||[]).forEach(x=>{meta[x.id]={name:x.name,rarity:x.rarity||""}});render()}catch(e){}}function tabs(){let e=document.getElementById("tabs");e.innerHTML="";S.forEach((s,i)=>{let b=document.createElement("button");b.className="tab"+(i===cur?" on":"");b.textContent=s[0];b.onclick=()=>{cur=i;tabs();render()};e.appendChild(b)})}function render(){let s=S[cur];loadMeta(s);let a=nums(s),q=document.getElementById("q").value.trim(),f=document.getElementById("f").value,own=a.filter(n=>has(s,n)).length;document.getElementById("sum").textContent=s[0]+" · "+own+" / "+a.length+" in bezit";a=a.filter(n=>(!q||String(n).includes(q))&&(f==="all"||(f==="yes"&&has(s,n))||(f==="no"&&!has(s,n))));let g=document.getElementById("grid");g.innerHTML="";a.forEach(n=>{let ov=ownedVariants(s,n),y=ov.length>0,e=document.createElement("article");e.className="card"+(y?" y":"");let ownedText=ov.length?ov.map(v=>v+" ✓").join(" · "):"Nog geen variant";e.innerHTML='<div class="row"><span class="num">#'+String(n).padStart(3,"0")+'</span><span class="name">'+cardName(s,n)+'<span class="kind">'+cardKind(s,n)+'</span><span class="ownedline '+(ov.length?"":"none")+'">'+ownedText+'</span></span><span class="status">'+(y?"✓ "+ov.length:"OPEN")+'</span></div><div class="details"><img class="pic" loading="lazy" src="'+img(s,n)+'" alt="'+s[0]+' #'+n+'" onerror="this.style.opacity=.15"><div class="variants">'+V.map(v=>'<button class="vbtn '+(vhas(s,n,v)?"on":"")+'" data-v="'+v+'">'+v+(vhas(s,n,v)?" ✓":"")+'</button>').join("")+'</div></div>';e.querySelector(".row").onclick=()=>e.classList.toggle("open");e.querySelectorAll(".vbtn").forEach(b=>b.onclick=(ev)=>{ev.stopPropagation();let v=b.dataset.v;setVariant(s,n,v,!vhas(s,n,v));render()});g.appendChild(e)})}document.getElementById("q").oninput=render;document.getElementById("f").onchange=render;tabs();render();
</script></body></html>
