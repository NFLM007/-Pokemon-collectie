*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:10;background:#111827;color:#fff;padding:14px}h1{font-size:20px;margin:0 0 10px}.tools,.tabs{display:flex;gap:8px}.tabs{overflow:auto;padding-top:10px}.tab{white-space:nowrap;border:0;border-radius:99px;padding:9px 12px;background:#374151;color:#fff;font-weight:700}.tab.on{background:#facc15;color:#111827}input,select{border:0;border-radius:10px;padding:10px;font-size:16px}input{min-width:0;flex:1}main{padding:14px;max-width:1100px;margin:auto}.sum{font-weight:800;margin-bottom:12px}.grid{display:flex;flex-direction:column;gap:7px}.card{background:#fff;border:2px solid transparent;border-radius:12px;padding:0;box-shadow:0 1px 5px #0001;overflow:hidden}.card.y{border-color:#22c55e;background:#f0fdf4}.row{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}.num{font-weight:900;min-width:52px}.name{flex:1;font-weight:700}.status{border-radius:99px;padding:5px 8px;font-size:11px;font-weight:900;background:#e5e7eb}.y .status{background:#16a34a;color:#fff}.details{display:none;padding:0 12px 12px;text-align:center}.card.open .details{display:block}.pic{width:min(100%,320px);aspect-ratio:2.5/3.5;object-fit:contain;background:#e5e7eb;border-radius:10px}.toggle{display:block;width:min(100%,320px);margin:8px auto 0;border:0;border-radius:10px;padding:11px;font-weight:900;background:#111827;color:#fff}.y .toggle{background:#16a34a}@media(min-width:700px){main{max-width:760px}}</style></head><body><header><h1>⚡ Mijn Pokémon Collectie</h1><div class="tools"><input id="q" placeholder="Zoek nummer…"><select id="f"><option value="all">Alles</option><option value="yes">In bezit</option><option value="no">Ontbreekt</option></select></div><div class="tabs" id="tabs"></div></header><main><div class="sum" id="sum"></div><div class="grid" id="grid"></div></main><script>

let cur=0,store=JSON.parse(localStorage.getItem("poke-all-v1")||"{}");function key(s,n){return s[0]+"#"+n}function has(s,n){let k=key(s,n);return k in store?store[k]:s[3].includes(n)}function nums(s){return s[2]?[...Array(s[2])].map((_,i)=>i+1):s[3]}function img(s,n){return "https://images.scrydex.com/pokemon/"+s[1]+"-"+n+"/medium"}function tabs(){let e=document.getElementById("tabs");e.innerHTML="";S.forEach((s,i)=>{let b=document.createElement("button");b.className="tab"+(i===cur?" on":"");b.textContent=s[0];b.onclick=()=>{cur=i;tabs();render()};e.appendChild(b)})}function render(){let s=S[cur],a=nums(s),q=document.getElementById("q").value.trim(),f=document.getElementById("f").value,own=a.filter(n=>has(s,n)).length;document.getElementById("sum").textContent=s[0]+" · "+own+" / "+a.length+" in bezit";a=a.filter(n=>(!q||String(n).includes(q))&&(f==="all"||(f==="yes"&&has(s,n))||(f==="no"&&!has(s,n))));let g=document.getElementById("grid");g.innerHTML="";a.forEach(n=>{let y=has(s,n),e=document.createElement("article");e.className="card"+(y?" y":"");e.innerHTML='<div class="row"><span class="num">#'+String(n).padStart(3,"0")+'</span><span class="name">'+s[0]+' #'+String(n).padStart(3,"0")+'</span><span class="status">'+(y?"✓ HEB IK":"ONTBREEKT")+'</span></div><div class="details"><img class="pic" loading="lazy" src="'+img(s,n)+'" alt="'+s[0]+' #'+n+'" onerror="this.style.opacity=.15"><button class="toggle">'+(y?"✓ Verwijder uit bezit":"+ Voeg toe aan bezit")+'</button></div>';e.querySelector(".row").onclick=()=>e.classList.toggle("open");e.querySelector(".toggle").onclick=(ev)=>{ev.stopPropagation();store[key(s,n)]=!has(s,n);localStorage.setItem("poke-all-v1",JSON.stringify(store));render()};g.appendChild(e)})}document.getElementById("q").oninput=render;document.getElementById("f").onchange=render;tabs();render();
